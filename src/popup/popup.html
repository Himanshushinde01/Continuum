<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextBridge</title>
    <style>
      /* System font stack — no CDN dependency, works fully offline */
      :root {
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto',
          system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        background: #0f0f13;
        color: #e2e8f0;
        width: 380px;
        min-height: 480px;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* Prevent focus outline flash on popup open */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup-entry.tsx"></script>
  </body>
</html>
